name: ci-nix

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Build Blaster library
        run: nix build .#default

      - name: Build z3check executable
        run: nix build .#z3check

      - name: Verify z3check runs
        run: nix run .#z3check

      - name: Verify blaster tactic works
        run: |
          nix develop --command bash -c 'lake build && lake env lean tests/nix/TestBlaster.lean'
