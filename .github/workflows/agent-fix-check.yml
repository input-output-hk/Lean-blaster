name: Check issue-fix automation

on:
  pull_request:
    paths:
      - '.agents/skills/fix-issue/**'
      - '.github/agent-fix/**'
      - '.github/workflows/agent-fix*.yml'
      - 'scripts/test_agent_fix.py'
  push:
    branches: [main, staging]
    paths:
      - '.agents/skills/fix-issue/**'
      - '.github/agent-fix/**'
      - '.github/workflows/agent-fix*.yml'
      - 'scripts/test_agent_fix.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test trusted runner and patch boundaries without model/API calls
        run: python3 -B -m unittest discover -s scripts -p 'test_agent_fix.py'
      - name: Check setup script syntax
        run: bash -n .github/agent-fix/setup.sh
