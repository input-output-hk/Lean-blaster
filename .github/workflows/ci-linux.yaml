name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  Z3_VERSION: "4.15.2"
  GLIBC_Z3: "2.39"
  CVC5_VERSION: "1.3.4"
  CVC5_FLOOR_VERSION: "1.2.1"

jobs:
  solver-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: z3
            install_z3: true
            install_cvc5: false
            install_cvc5_floor: false
          - tier: cvc5
            install_z3: false
            install_cvc5: true
            install_cvc5_floor: false
          - tier: all-solvers
            install_z3: true
            install_cvc5: true
            install_cvc5_floor: false
          - tier: cvc5-1.2.1
            install_z3: false
            install_cvc5: false
            install_cvc5_floor: true

    name: solver tests (${{ matrix.tier }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Lean
        # The toolchain is pinned by the repo's `lean-toolchain` file (single
        # source of truth); elan is installed without a default toolchain to
        # avoid downloading an unpinned "stable" release.
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Install Lean toolchain
        # The toolchain download is a large GitHub-release fetch; retry
        # transient failures before giving up.
        run: |
          TOOLCHAIN="$(cat lean-toolchain)"
          for attempt in 1 2 3; do
            /home/runner/.elan/bin/elan toolchain install "$TOOLCHAIN" && break
            if [ "$attempt" = 3 ]; then
              echo "::error::Failed to install Lean toolchain $TOOLCHAIN after 3 attempts"
              exit 1
            fi
            echo "elan toolchain install failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          /home/runner/.elan/bin/elan default "$TOOLCHAIN"

      - name: Install Z3
        if: ${{ matrix.install_z3 }}
        run: |
          cd /home/runner/
          wget -q https://github.com/Z3Prover/z3/releases/download/z3-${{ env.Z3_VERSION }}/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          unzip -q z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          chmod +x /home/runner/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}/bin/z3
          echo "/home/runner/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}/bin" >> $GITHUB_PATH

      - name: Install cvc5
        if: ${{ matrix.install_cvc5 }}
        run: |
          cd /home/runner/
          wget -q https://github.com/cvc5/cvc5/releases/download/cvc5-${{ env.CVC5_VERSION }}/cvc5-Linux-x86_64-static.zip
          unzip -q cvc5-Linux-x86_64-static.zip
          chmod +x /home/runner/cvc5-Linux-x86_64-static/bin/cvc5
          echo "/home/runner/cvc5-Linux-x86_64-static/bin" >> $GITHUB_PATH

      - name: Install cvc5 support floor
        if: ${{ matrix.install_cvc5_floor }}
        run: |
          cd /home/runner/
          wget -q https://github.com/cvc5/cvc5/releases/download/cvc5-${{ env.CVC5_FLOOR_VERSION }}/cvc5-Linux-x86_64-static.zip
          unzip -q cvc5-Linux-x86_64-static.zip
          mv cvc5-Linux-x86_64-static cvc5-${{ env.CVC5_FLOOR_VERSION }}-Linux-x86_64-static
          chmod +x /home/runner/cvc5-${{ env.CVC5_FLOOR_VERSION }}-Linux-x86_64-static/bin/cvc5
          echo "/home/runner/cvc5-${{ env.CVC5_FLOOR_VERSION }}-Linux-x86_64-static/bin" >> $GITHUB_PATH

      - name: Lean versions
        run: |
          elan --version
          lake --version
          lean --version

      - name: Z3 version
        if: ${{ matrix.install_z3 }}
        run: z3 --version

      - name: cvc5 version
        if: ${{ matrix.install_cvc5 || matrix.install_cvc5_floor }}
        run: cvc5 --version | head -1

      - name: Build and Validate Blaster
        run: make check_blaster

      - name: Solver-independent tests
        if: matrix.tier == 'z3' || matrix.tier == 'cvc5'
        run: make test-pure

      - name: Z3 backend tests
        if: matrix.tier == 'z3'
        run: make test-z3

      - name: Strict cvc5 result conformance
        if: matrix.tier == 'cvc5'
        run: make BLASTER_TIMEOUT=120 test-cvc5

      - name: Cross-backend integration
        if: matrix.tier == 'all-solvers'
        run: make test-all-solvers

      - name: cvc5 1.2.1 support-floor compatibility
        if: matrix.tier == 'cvc5-1.2.1'
        run: make test-cvc5-floor

      - name: Upload Blaster build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: blaster-build-${{ matrix.tier }}
          path: ./build.log
          if-no-files-found: ignore

      - name: Upload solver agreement artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blaster-agreement-${{ matrix.tier }}
          path: .blaster/agreement-*
          include-hidden-files: true
          if-no-files-found: ignore

  patched-cvc5-parity:
    name: pinned patched cvc5 parity
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      # Official GCC 14.2.0 bookworm image, immutable Linux/amd64 manifest.
      image: gcc:14.2.0-bookworm@sha256:82549aa8f90ada3236a8be70c74543132a76662ef33f0c3271ed802b81584a82
    defaults:
      run:
        shell: bash
    env:
      CC: /usr/local/bin/gcc
      CXX: /usr/local/bin/g++
      CVC5_CI_IMAGE: gcc:14.2.0-bookworm@sha256:82549aa8f90ada3236a8be70c74543132a76662ef33f0c3271ed802b81584a82
      CVC5_DEBIAN_SNAPSHOT: "20250522T000000Z"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frozen build dependencies
        run: |
          mkdir -p .blaster/patched-ci/diagnostics
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          printf '%s\n' \
            "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${CVC5_DEBIAN_SNAPSHOT}/ bookworm main" \
            > /etc/apt/sources.list
          apt-get update 2>&1 | tee .blaster/patched-ci/diagnostics/apt-update.log
          apt-get install -y --no-install-recommends \
            cmake=3.25.1-1 ninja-build=1.11.1-2~deb12u1 \
            python3=3.11.2-1+b1 python3-venv=3.11.2-1+b1 elan=1.4.2-5 \
            pkg-config=1.8.1-1 patch=2.7.6-7 zstd=1.5.4+dfsg2-5 \
            2>&1 | tee .blaster/patched-ci/diagnostics/apt-install.log
          dpkg-query -W > .blaster/patched-ci/diagnostics/packages.txt
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install repository-pinned Lean
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan --version
          lake --version
          lean --version

      - name: Build pinned control and patched cvc5
        run: |
          python3 scripts/build_patched_cvc5.py \
            --output .blaster/patched-ci/build --jobs 2 \
            2>&1 | tee .blaster/patched-ci/diagnostics/build-driver.log

      - name: Check recovered fixtures and Lean evidence against control
        run: |
          lake build Blaster
          python3 scripts/check_cvc5_parity.py \
            --control .blaster/patched-ci/build/control/build-parity/bin/cvc5 \
            --patched .blaster/patched-ci/build/patched/build-parity/bin/cvc5 \
            --provenance .blaster/patched-ci/build/provenance.json \
            --output .blaster/patched-ci/parity \
            2>&1 | tee .blaster/patched-ci/diagnostics/parity-driver.log

      - name: Upload pinned build and parity diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pinned-patched-cvc5-parity
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .blaster/patched-ci/diagnostics/
            .blaster/patched-ci/parity/
            .blaster/patched-ci/build/provenance.json
            .blaster/patched-ci/build/commands.log
            .blaster/patched-ci/build/logs/
            .blaster/patched-ci/build/*.patch
            .blaster/patched-ci/build/*-CMakeCache.txt
            .blaster/patched-ci/build/*/build-parity/deps/src/*-stamp/*.log
