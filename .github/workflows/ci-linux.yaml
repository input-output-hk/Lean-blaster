name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_VERSION: "4.24.0"
  Z3_VERSION: "5.4.0"
  GLIBC_Z3: "2.39"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Fix Elan version
        run: |
          elan toolchain install ${{ env.LEAN_VERSION }}
          elan default ${{ env.LEAN_VERSION }}

      - name: Install Z3 (release)
        if: env.Z3_VERSION != 'master'
        run: |
          cd /home/runner/
          wget -q https://github.com/Z3Prover/z3/releases/download/z3-${{ env.Z3_VERSION }}/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          unzip -q z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          chmod +x z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          z3_root="/home/runner/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}"
          echo "$z3_root/bin" >> "$GITHUB_PATH"
          echo "Z3_LIB_PATH=$z3_root/bin" >> "$GITHUB_ENV"
          echo "Z3_INC_PATH=$z3_root/include" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$z3_root/bin:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Resolve Z3 master commit
        if: env.Z3_VERSION == 'master'
        id: z3-master
        run: |
          sha=$(git ls-remote https://github.com/Z3Prover/z3.git refs/heads/master | cut -f1)
          echo "sha=$sha" >> $GITHUB_OUTPUT

      - name: Restore cached Z3 master build
        if: env.Z3_VERSION == 'master'
        id: z3-master-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/z3-master
          key: z3-master-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.z3-master.outputs.sha }}

      - name: Build Z3 from master
        if: env.Z3_VERSION == 'master' && steps.z3-master-cache.outputs.cache-hit != 'true'
        run: |
          cd /home/runner/
          git clone --depth 1 --branch master https://github.com/Z3Prover/z3.git z3-src
          cmake -S z3-src -B z3-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DZ3_BUILD_LIBZ3_SHARED=ON \
            -DZ3_BUILD_PYTHON_BINDINGS=OFF \
            -DZ3_BUILD_TEST_EXECUTABLES=OFF \
            -DCMAKE_INSTALL_PREFIX=/home/runner/z3-master
          cmake --build z3-src/build -j"$(nproc)"
          cmake --install z3-src/build

      - name: Save Z3 master build
        if: env.Z3_VERSION == 'master' && steps.z3-master-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/z3-master
          key: ${{ steps.z3-master-cache.outputs.cache-primary-key }}

      - name: Add Z3 master to PATH
        if: env.Z3_VERSION == 'master'
        run: |
          echo "/home/runner/z3-master/bin" >> "$GITHUB_PATH"
          echo "Z3_LIB_PATH=/home/runner/z3-master/lib" >> "$GITHUB_ENV"
          echo "Z3_INC_PATH=/home/runner/z3-master/include" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/home/runner/z3-master/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Tools version
        run: |
          elan --version
          lake --version
          lean --version
          z3 --version

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Z3 C API before Lean build
        run: |
          cc -g -O0 -I"$Z3_INC_PATH" scripts/z3_native_smoke.c \
            -L"$Z3_LIB_PATH" -lz3 -o /tmp/z3_native_smoke
          /tmp/z3_native_smoke

      - name: Build and Validate Blaster
        run: make check_blaster

      - name: Check self-contained Z3 shim
        run: |
          shim=.lake/build/lib/libz3shim.so
          test -f "$shim"
          if ldd "$shim" | grep -q 'libz3\.so'; then
            echo 'Z3 was linked dynamically into the Lean shim' >&2
            exit 1
          fi
          if nm -D --defined-only "$shim" | grep -Eq '(_Unwind_|__gxx_personality_v0)'; then
            echo 'The Z3 C++ exception runtime leaked into the global symbol table' >&2
            exit 1
          fi

      - name: Check native Lean solver and exception runtime
        run: lake build Tests.StateMachine.Counter03

      - name: Upload Blaster build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: blaster-build
          path: ./Blaster/build.log

      - name: Execute and Validate Tests
        run: LEAN_NUM_THREADS=5 lake test 2>&1 | tee Tests/build.log

      - name: Upload Tests log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-build
          path: ./Tests/build.log
