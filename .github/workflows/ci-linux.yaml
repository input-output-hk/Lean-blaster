name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_VERSION: "4.24.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Fix Elan version
        run: |
          elan toolchain install ${{ env.LEAN_VERSION }}
          elan default ${{ env.LEAN_VERSION }}

      - name: Restore pinned solver
        id: solver-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/assurance-z3
          key: assurance-z3-${{ runner.os }}-${{ hashFiles('scripts/build-assurance-z3.sh') }}

      - name: Build pinned solver
        if: steps.solver-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-assurance-z3.sh "$RUNNER_TEMP/assurance-z3"

      - name: Select and check solver
        run: |
          echo "$RUNNER_TEMP/assurance-z3/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/assurance-z3/bin:$PATH" lake env lean --run Z3Check.lean

      - name: Tools version
        run: |
          elan --version
          lake --version
          lean --version
          z3 --version

      - name: Build and Validate Blaster
        run: make check_blaster

      - name: Upload Blaster build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: blaster-build
          path: ./Blaster/build.log

      - name: Execute and Validate Tests
        run: LEAN_NUM_THREADS=5 ./scripts/check_lean_project_compilation.sh Tests

      - name: Upload Tests log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-build
          path: ./Tests/build.log
