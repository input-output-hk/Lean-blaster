name: Bug Report
description: Report a bug or unexpected behavior in Blaster
title: "[Bug]: "
labels: ["bug", "status: needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Include a complete minimal Lean reproducer and the expected and actual outcomes.
        A maintainer can add the agent:fix label to request a generic fix and draft PR.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Paste a complete minimal example in a fenced Lean code block, including imports and declarations.
      placeholder: |
        ```lean
        import Blaster
        -- Minimal example demonstrating the bug
        ```
    validations:
      required: true

  - type: input
    id: target-branch
    attributes:
      label: Target Branch
      description: Branch containing the bug and intended PR destination. Leave blank for the repository default branch.
      placeholder: main
    validations:
      required: false

  - type: input
    id: reproduction-command
    attributes:
      label: Reproduction Command
      description: The exact command used to run the example.
      placeholder: lake env lean Repro.lean
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages.
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: input
    id: lean-version
    attributes:
      label: Lean Version
      description: What version of Lean4 are you using?
      placeholder: e.g., v4.24.0
    validations:
      required: true

  - type: input
    id: z3-version
    attributes:
      label: Z3 Version
      description: What version of Z3 are you using?
      placeholder: e.g., v4.15.2
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any other relevant information
