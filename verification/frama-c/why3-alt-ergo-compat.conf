# Why3 1.8's default Alt-Ergo 2.4 driver produces unrecognized prover
# answers with alt-ergo-free 2.4.3 for the mutual cleanup obligations.
# The bundled 2.3 driver emits the compatible legacy .why format.
[main]
magic = 14
timelimit = 10
memlimit = 1000

[prover]
name = "Alt-Ergo"
version = "2.4.3"
command = "alt-ergo --timelimit %t %f"
driver = "alt_ergo_2_3"
shortcut = "alt-ergo"
